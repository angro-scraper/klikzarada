<!doctype html>
<html lang="sr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sačuvaj Hranu — Admin prijava</title>
  <link rel="stylesheet" href="/admin-assets/styles.css" />
  <link rel="stylesheet" href="/admin-assets/brand-system-v56.css" />
</head>
<body class="admin-login-body-v33">
  <main class="admin-login-shell-v33">
    <section class="admin-login-card-v33">
      <p class="eyebrow">Sačuvaj Hranu · Siguran pristup</p>
      <h1>Admin prijava</h1>
      <p class="subtitle">Finansije, AI trening i admin panel su sada zaključani PIN-om. Ovo je lokalni MVP režim; kasnije dodajemo korisničke naloge i role.</p>
      <form id="adminLoginForm" class="admin-login-form-v33">
        <label>Admin PIN
          <input id="adminPinInput" type="password" inputmode="numeric" autocomplete="current-password" placeholder="Unesi admin PIN" required />
        </label>
        <button type="submit">Prijavi se</button>
      </form>
      <div id="adminLoginMessage" class="admin-login-message-v33">Podrazumevani lokalni PIN je u .env fajlu: ADMIN_PIN.</div>
      <div class="admin-login-links-v33">
        <a href="/offers">Korisnička strana</a>
        <a href="/seller">Prodavac panel</a>
      </div>
    </section>
  </main>
  <script src="/admin-assets/admin-auth.js"></script>
  <script src="/admin-assets/brand-system-v56.js"></script>
</body>
</html>
