<!doctype html><html lang="sr"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/><title>Sačuvaj Hranu — Kupac Plus</title><link rel="stylesheet" href="/admin-assets/styles.css"/>
  <link rel="stylesheet" href="/admin-assets/brand-system-v56.css" />
</head>
<body class="customer-plus-v36"><header class="public-hero"><div><p class="eyebrow">Sačuvaj Hranu · Kupac Plus</p><h1>Omiljeni, pretrage, referral i ocene</h1><p class="subtitle">MVP centar za zadržavanje korisnika. Prava OTP zaštita ostaje na strani „Moj nalog”.</p></div><nav class="top-actions"><a class="link-button" href="/offers">Ponude</a><a class="link-button secondary-link" href="/customer">Moj nalog</a></nav></header>
<main class="offers-main"><section class="card wide"><h2>Telefon kupca</h2><div class="inline-form"><input id="phone" placeholder="Telefon"><button id="loadBtn">Učitaj</button><button id="refBtn" class="secondary">Moj referral kod</button></div><pre id="refBox" class="log-box"></pre></section>
<section class="card wide"><h2>Sačuvaj pretragu</h2><div class="grid-form"><input id="searchLabel" placeholder="Naziv, npr. Pekara blizu posla"><input id="searchQuery" placeholder="Upit"><input id="searchCity" placeholder="Grad/naselje"><input id="searchCategory" placeholder="Kategorija"><input id="searchPrice" type="number" placeholder="Max cena"><button id="saveSearchBtn">Sačuvaj</button></div><div id="savedSearches"></div></section>
<section class="card wide"><h2>Omiljeni prodavci</h2><div class="inline-form"><input id="favoriteStoreId" type="number" placeholder="ID prodavca"><button id="addFavBtn">Dodaj omiljenog</button></div><div id="favoritesBox"></div></section>
<section class="card wide"><h2>Oceni preuzetu rezervaciju</h2><div class="grid-form"><input id="reviewCode" placeholder="Kod rezervacije"><select id="reviewRating"><option value="5">5 ★</option><option value="4">4 ★</option><option value="3">3 ★</option><option value="2">2 ★</option><option value="1">1 ★</option></select><textarea id="reviewComment" placeholder="Komentar"></textarea><button id="sendReviewBtn">Pošalji ocenu</button></div></section>
</main><div id="toast"></div><script src="/admin-assets/customer-plus.js"></script>  <script src="/admin-assets/brand-system-v56.js"></script>
</body></html>
