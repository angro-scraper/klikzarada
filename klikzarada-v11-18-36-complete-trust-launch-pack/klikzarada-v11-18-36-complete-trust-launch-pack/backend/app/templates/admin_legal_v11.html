{% extends "app_base.html" %}{% set title="Legal V11" %}{% block app_content %}
<div class="section-heading left"><span>V11 Legal</span><h2>Legal pages i forbidden task rules</h2></div>
<div class="grid-2"><form class="form-panel" method="post" action="/admin/legal-v11/page"><h3>Legal page</h3><label>Slug</label><input name="slug" required><label>Title</label><input name="title" required><label>Body</label><textarea name="body" required></textarea><label>Version</label><input name="version" value="1.0"><label>Status</label><select name="status"><option>published</option><option>draft</option></select><button class="btn btn-primary">Sačuvaj</button></form>
<form class="form-panel" method="post" action="/admin/legal-v11/rule"><h3>Forbidden rule</h3><label>Title</label><input name="title" required><label>Pattern</label><input name="pattern" required><label>Severity</label><select name="severity"><option>medium</option><option>high</option><option>critical</option></select><label>Akcija</label><input name="action" value="reject_campaign"><button class="btn btn-primary">Dodaj rule</button></form></div>
<div class="table-card"><table><thead><tr><th>Slug</th><th>Title</th><th>Version</th><th>Status</th><th>Link</th></tr></thead><tbody>{% for p in pages %}<tr><td>{{ p.slug }}</td><td>{{ p.title }}</td><td>{{ p.version }}</td><td>{{ p.status }}</td><td><a href="/legal/{{ p.slug }}">Otvori</a></td></tr>{% endfor %}</tbody></table></div>
{% endblock %}
