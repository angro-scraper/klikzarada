{% extends "app_base.html" %}{% set title="Profil korisnika" %}{% block app_content %}
<h1>Korisnički profil</h1><form class="card form" method="post"><label>Ime</label><input name="full_name" value="{{ user.full_name }}"><div class="two"><div><label>Telefon</label><input name="phone" value="{{ user.phone or '' }}"></div><div><label>Grad</label><input name="city" value="{{ user.city or '' }}"></div></div><div class="two"><div><label>Starosna grupa</label><input name="age_group" value="{{ user.age_group or '' }}"></div><div><label>Pol</label><input name="gender" value="{{ user.gender or '' }}"></div></div><label>Interesovanja</label><textarea name="interests">{{ user.interests or '' }}</textarea><label>Uređaj</label><input name="device" value="{{ user.device or '' }}"><div class="two"><div><label>Metod isplate</label><input name="payment_method" value="{{ user.payment_method or '' }}"></div><div><label>Podaci za isplatu</label><input name="payment_details" value="{{ user.payment_details or '' }}"></div></div><button class="btn">Sačuvaj</button></form>
{% endblock %}
