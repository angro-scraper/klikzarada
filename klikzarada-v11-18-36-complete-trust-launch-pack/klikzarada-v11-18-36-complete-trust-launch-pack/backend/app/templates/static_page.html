{% extends "base.html" %}
{% set extra_body_class = "kz1189-home-premium" %}
{% block content %}
<div class="kz1189-page kz1189-home-premium">
<section class="page">
  <span class="eyebrow">{{ title }}</span>
  <h1>{{ heading }}</h1>
  <p>{{ body }}</p>
  {% if heading == "Kontakt" %}
  <div class="hint" style="margin-top:22px;text-align:left;">
    <b>Direktan kontakt</b>
    <p style="margin:8px 0 0;">
      Piši na <a href="mailto:kontakt@klik-zarada.rs">kontakt@klik-zarada.rs</a> za saradnju, oglašavanje i podršku.
    </p>
  </div>
  {% endif %}
</section>
</div>
{% endblock %}
