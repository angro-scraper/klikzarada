{% extends "base.html" %}{% set title="Registracija" %}{% block content %}
<section class="auth"><form method="post" class="card"><h1>Registracija</h1>{% if error %}<div class="flash error">{{ error }}</div>{% endif %}<label>Ime / firma</label><input name="full_name" required><label>Email</label><input type="email" name="email" required><label>Lozinka</label><input type="password" name="password" required><div class="two"><div><label>Grad</label><input name="city"></div><div><label>Telefon</label><input name="phone"></div></div><label>Tip naloga</label><select name="role"><option value="korisnik" {% if role=="korisnik" %}selected{% endif %}>Korisnik</option><option value="oglasivac" {% if role=="oglasivac" %}selected{% endif %}>Oglašivač</option></select><label>Referral kod</label><input name="referral_code" value="{{ ref }}"><button class="btn full">Napravi nalog</button></form></section>
{% endblock %}
