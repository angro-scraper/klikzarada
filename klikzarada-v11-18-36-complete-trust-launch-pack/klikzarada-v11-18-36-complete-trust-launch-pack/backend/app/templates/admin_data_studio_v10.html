{% extends "app_base.html" %}{% set title="Data Studio V10" %}{% block app_content %}
<div class="section-heading left"><span>V10 Data Studio</span><h2>Kontrolna tablai i widgeti</h2></div>
<div class="grid-2"><form class="form-panel" method="post" action="/admin/data-studio-v10/dashboard"><h3>Kontrolna tabla</h3><label>Title</label><input name="title" required><label>Audience</label><select name="audience"><option>admin</option><option>advertiser</option><option>public</option></select><button class="btn btn-primary">Dodaj dashboard</button></form>
<form class="form-panel" method="post" action="/admin/data-studio-v10/widget"><h3>Widget</h3><label>Kontrolna tabla</label><select name="dashboard_id">{% for d in dashboards %}<option value="{{ d.id }}">{{ d.title }}</option>{% endfor %}</select><label>Title</label><input name="title" required><label>Type</label><select name="widget_type"><option>metric</option><option>table</option><option>chart</option></select><label>Metric key</label><input name="metric_key"><label>Config</label><textarea name="config_text"></textarea><button class="btn btn-primary">Dodaj widget</button></form></div>
<div class="grid-3">{% for d in dashboards %}<div class="info-card"><span class="pill">{{ d.audience }}</span><h3>{{ d.title }}</h3><p>Status: {{ d.status }}</p></div>{% endfor %}</div>
{% endblock %}
