services:
  - type: web
    name: klikzarada-v11
    env: docker
    plan: starter
    rootDir: backend
    autoDeploy: false
    healthCheckPath: /api/v1/v11/health
    envVars:
      - key: KLIKZARADA_SECRET_KEY
        sync: false
      - key: APP_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # PayPal credentials stay only in Render. Do not put their values in Git.
      - key: PAYPAL_MODE
        value: live
      - key: PAYPAL_CLIENT_ID
        sync: false
      - key: PAYPAL_CLIENT_SECRET
        sync: false
      - key: PAYPAL_WEBHOOK_ID
        sync: false
      - key: PAYPAL_CARD_PAYMENTS_ENABLED
        value: true
      - key: PAYPAL_RSD_PER_EUR
        sync: false
      - key: PUBLIC_APP_URL
        sync: false
