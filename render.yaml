    name: klikzarada-v11
    env: docker
    plan: starter
    rootDir: klikzarada-v11-18-36-complete-trust-launch-pack/klikzarada-v11-18-36-complete-trust-launch-pack/backend
    autoDeploy: false
    healthCheckPath: /api/v1/v11/health
